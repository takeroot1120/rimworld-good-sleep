<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#0c1533"/>
			<stop offset="65%" stop-color="#16234a"/>
			<stop offset="100%" stop-color="#241a3d"/>
		</linearGradient>
		<radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#fff6d8" stop-opacity="0.55"/>
			<stop offset="100%" stop-color="#fff6d8" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="blanket" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#6f8fc7"/>
			<stop offset="100%" stop-color="#4f6aa0"/>
		</linearGradient>
	</defs>

	<rect x="0" y="0" width="640" height="360" fill="url(#sky)"/>

	<circle cx="512" cy="86" r="90" fill="url(#moonGlow)"/>
	<path d="M 540 50 A 42 42 0 1 0 540 122 A 33 33 0 1 1 540 50 Z" fill="#fbf3d0"/>

	<g fill="#f4f0ff">
		<circle cx="70" cy="54" r="1.8" opacity="0.9"/>
		<circle cx="120" cy="90" r="1.3" opacity="0.7"/>
		<circle cx="180" cy="46" r="1.6" opacity="0.85"/>
		<circle cx="240" cy="80" r="1.2" opacity="0.6"/>
		<circle cx="300" cy="40" r="1.6" opacity="0.8"/>
		<circle cx="360" cy="70" r="1.3" opacity="0.7"/>
		<circle cx="410" cy="34" r="1.4" opacity="0.75"/>
		<circle cx="40" cy="120" r="1.3" opacity="0.6"/>
		<circle cx="150" cy="140" r="1.1" opacity="0.5"/>
		<circle cx="270" cy="120" r="1.1" opacity="0.55"/>
		<circle cx="590" cy="60" r="1.4" opacity="0.7"/>
		<circle cx="610" cy="130" r="1.1" opacity="0.5"/>
	</g>

	<!-- distant hills -->
	<path d="M 0 260 Q 120 225 260 255 T 640 245 L 640 360 L 0 360 Z" fill="#141029" opacity="0.9"/>

	<!-- floor -->
	<rect x="0" y="300" width="640" height="60" fill="#0e0c1f"/>

	<!-- bed, side view: tall headboard + low footboard + legs, so it reads as a bed and not a flat stack -->
	<g>
		<!-- legs -->
		<rect x="158" y="306" width="12" height="20" rx="2" fill="#3f2a1c"/>
		<rect x="424" y="306" width="12" height="20" rx="2" fill="#3f2a1c"/>

		<!-- footboard (short, far end) -->
		<rect x="410" y="256" width="18" height="58" rx="5" fill="#4a3324"/>

		<!-- frame box: front side panel below the mattress -->
		<rect x="164" y="276" width="260" height="38" rx="8" fill="#5a3d2b"/>

		<!-- mattress top -->
		<rect x="160" y="252" width="268" height="30" rx="7" fill="url(#blanket)"/>
		<path d="M 200 262 Q 290 254 400 260" stroke="#7f9cd1" stroke-width="3" fill="none"
		      stroke-linecap="round" opacity="0.5"/>

		<!-- headboard (tall, near end) -->
		<rect x="148" y="196" width="26" height="118" rx="9" fill="#4a3324"/>
		<rect x="153" y="204" width="16" height="70" rx="6" fill="#5a3d2b"/>
	</g>

	<!-- Zzz -->
	<g fill="#dfe6ff" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">
		<text x="240" y="205" font-size="26" transform="rotate(-8 240 205)" opacity="0.95">z</text>
		<text x="262" y="178" font-size="34" transform="rotate(-8 262 178)" opacity="0.9">Z</text>
		<text x="292" y="142" font-size="44" transform="rotate(-8 292 142)" opacity="0.85">Z</text>
	</g>

	<!-- title -->
	<g font-family="Georgia, 'Times New Roman', serif">
		<text x="34" y="60" font-size="46" fill="#0a0714" opacity="0.55">Good Sleep</text>
		<text x="32" y="58" font-size="46" fill="#fdfaf0">Good Sleep</text>
	</g>
</svg>
